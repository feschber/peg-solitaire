[workspace]
members = ["solitaire-game", "solitaire-solver"]

[package]
name = "peg-solitaire"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.45", features = ["derive"] }
env_logger = "0.11.10"
log = { version = "*", features = ["release_max_level_info"] }
rustc-hash = "2.1.3"
solitaire-game = { path = "./solitaire-game", version = "0.0.1", optional = true }
solitaire-solver = { path = "./solitaire-solver", version = "0.0.1" }

[dev-dependencies]
rayon = "1.11.0"
rand = "0.10"

# run build.rs in release mode, otherwise it takes 100 years
[profile.dev.build-override]
opt-level = 2
debug = false

# `release` but with symbols, since `release` strips them and a stripped profile
# reports bare addresses. Same codegen as release - inherits every setting including
# `lto`, `codegen-units = 1` and `panic = "abort"` - so timings taken here are
# comparable to the shipped binary's.
[profile.profiling]
inherits = "release"
strip = "none"
debug = 1

[features]
default = ["game"]
game = ["dep:solitaire-game"]
# wraps the global allocator to count allocations - see `counting` in src/main.rs
count-allocs = []

[profile.release]
lto = "thin"
strip = "symbols"
panic = "abort"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
